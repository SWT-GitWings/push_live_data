<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sproutwings</title>
    <link rel="stylesheet" href="/public/css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="icon" href="https://www.sproutwings.in/assets/favicon-32x32.png" type="image/png">
</head>

<body>
    <div class="login-page">

        <section class="brand-panel">
            <div class="brand-content">
                <div class="logo-wrap">
                    <img src="https://www.sproutwings.in/assets/Sproutwings-Black5-jZNzq4K0.png" alt="Sproutwings">
                </div>

                <h1>Push Live Data</h1>
                <div class="brand-line"></div>
                <p>
                    Securely manage your live data receivers, mapped users,
                    and data-push configurations from one place.
                </p>
            </div>
        </section>

        <section class="login-panel">
            <div class="login-card">

                <div class="mobile-logo">
                    <img src="https://www.sproutwings.in/assets/Sproutwings-Black5-jZNzq4K0.png" alt="Sproutwings">
                </div>

                <h2>Welcome Back</h2>
                <p class="login-subtitle">Sign in to continue to your dashboard.</p>

                <div class="error" id="errorMessage"></div>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <div class="input-wrap">
                            <span class="input-icon"><i class="fa-solid fa-user"></i></span>
                            <input id="username" type="text" placeholder="Enter your username" autocomplete="username">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-wrap">
                            <span class="input-icon"><i class="fa-solid fa-key"></i></span>
                            <input id="password" type="password" placeholder="Enter your password"
                                autocomplete="current-password">

                            <button type="button" class="password-toggle" id="togglePassword"
                                aria-label="Show password"><i class="fa-solid fa-eye-slash"></i></button>
                        </div>
                    </div>

                    <button type="submit" class="login-btn">
                        Sign In
                    </button>
                </form>

                <div class="copyright">
                    © 2026 Sproutwings. All rights reserved.
                </div>
            </div>
        </section>

    </div>

    <script src="/public/js/login.js"></script>
</body>

</html>
