<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sproutwings</title>
    <link rel="stylesheet" href="/public/css/login.css">
    <link rel="icon" href="https://www.sproutwings.in/assets/favicon-32x32.png" type="image/png">
</head>

<body>
    <div class="login-page">

        <section class="brand-panel">
            <div class="brand-content">
                <div class="logo-wrap">
                    <img src="https://www.sproutwings.in/assets/Sproutwings-Black5-jZNzq4K0.png" alt="Sproutwings">
                </div>

                <h1>Push Live Data</h1>
                <div class="brand-line"></div>
                <p>
                    Securely manage your live data receivers, mapped users,
                    and data-push configurations from one place.
                </p>
            </div>
        </section>

        <section class="login-panel">
            <div class="login-card">

                <div class="mobile-logo">
                    <img src="https://www.sproutwings.in/assets/Sproutwings-Black5-jZNzq4K0.png" alt="Sproutwings">
                </div>

                <h2>Welcome Back</h2>
                <p class="login-subtitle">Sign in to continue to your dashboard.</p>

                <div class="error" id="errorMessage"></div>

                <form id="loginForm">

                    <div class="form-group">
                        <label for="username">Username</label>
                        <div class="input-wrap">
                            <span class="input-icon">◉</span>
                            <input id="username" type="text" placeholder="Enter your username" autocomplete="username">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-wrap">
                            <span class="input-icon">◆</span>
                            <input id="password" type="password" placeholder="Enter your password"
                                autocomplete="current-password">

                            <button type="button" class="password-toggle" id="togglePassword"
                                aria-label="Show password">◉</button>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="remember">
                            <input type="checkbox" id="remember">
                            Remember me
                        </label>

                        <a href="#" class="forgot">Forgot Password?</a>
                    </div>

                    <button type="submit" class="login-btn">
                        Sign In
                    </button>
                </form>

                <div class="divider">Secure Login</div>

                <div class="support">
                    Need help?
                    <a href="mailto:support@sproutwings.in">Contact Support</a>
                </div>

                <div class="copyright">
                    © 2026 Sproutwings. All rights reserved.
                </div>

            </div>
        </section>

    </div>

    <script src="/public/js/login.js"></script>
</body>

</html>
