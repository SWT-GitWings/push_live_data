<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Pushed Log - Sproutwings</title>
    <link rel="stylesheet" href="/public/css/dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
</head>

<body>
    <div class="page">
        <main class="app">
            <header class="header">
                <div class="brand">
                    <img src="https://www.sproutwings.in/assets/Sproutwings-Black5-jZNzq4K0.png" alt="Sproutwings">
                </div>

                <div class="page-title">
                    <img class="upload-icon" src="/public/images/fetch_icon.svg" alt="">
                    <span>Download Pushed Log</span>

                    <div class="user-info">
                        <span class="username" id="headerUsername"></span>
                        <button class="logout-btn" id="logoutBtn" type="button" title="Logout">
                            <img class="logout-icon" src="/public/images/logout_icon.svg" alt="">
                            Logout
                        </button>
                    </div>
                </div>
            </header>

            <nav class="tabs" aria-label="Main navigation">
                <a class="tab" href="/dashboard">
                    <img class="tab-icon" src="/public/images/cloud_upload_red.svg" alt="">
                    Push Live Data
                </a>

                <a class="tab" href="/mines-push">
                    <img class="tab-icon" src="/public/images/growth_arrow_icon.svg" alt="">
                    Mines Push
                </a>

                <a class="tab active" href="/download-pushed-log">
                    <img class="tab-icon" src="/public/images/fetch_icon.svg" alt="">
                    Download Pushed Log
                </a>
            </nav>

            <section style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 20px;"
                class="download-receiver-card">
                <div class="receiver-row">
                    <label for="receiverTrigger">
                        Select Receiver <span class="required">*</span>
                    </label>

                    <div class="custom-select" id="receiverDropdown">
                        <button type="button" class="custom-select-trigger" id="receiverTrigger" aria-haspopup="listbox"
                            aria-expanded="false">
                            <span id="receiverLabel" class="receiver-label">Select receiver</span>
                            <span class="custom-select-arrow"><img src="/public/images/angle_down.svg" alt=""
                                    class=""></span>
                        </button>

                        <div class="custom-select-panel" id="receiverPanel" role="listbox" tabindex="-1"></div>
                    </div>

                    <label for="logDate">Date</label>
                    <input id="logDate" class="log-date" type="date" required>
                </div>
            </section>

            <section class="download-results-card" aria-label="Pushed logs">
                <div id="users" class="download-users"></div>
            </section>
        </main>
    </div>

    <div class="user-suggestion-panel" id="sharedSuggestionPanel" role="listbox"></div>

    <script src="/public/js/header.js"></script>
    <script src="/public/js/download.js"></script>
</body>

</html>
