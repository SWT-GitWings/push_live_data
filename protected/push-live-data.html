<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Push Live Data - Sproutwings</title>

    <link rel="stylesheet" href="/public/css/dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
</head>

<body>
    <div class="page">
        <main class="app">

            <header class="header">
                <div class="brand">
                    <img src="https://www.sproutwings.in/assets/Sproutwings-Black5-jZNzq4K0.png" alt="Sproutwings">
                </div>

                <div class="page-title">
                    <img class="upload-icon" src="/public/images/cloud_upload.svg" alt="">
                    <span>Push Live Data</span>

                    <div class="user-info">
                        <span class="username" id="headerUsername"></span>
                        <button class="logout-btn" id="logoutBtn" type="button" title="Logout">
                            <img class="logout-icon" src="/public/images/logout_icon.svg" alt="">
                            Logout
                        </button>
                    </div>
                </div>
            </header>

            <nav class="tabs" aria-label="Main navigation">
                <button class="tab active" type="button">
                    <img class="tab-icon" src="/public/images/cloud_upload_red.svg" alt="">
                    Push Live Data
                </button>

                <button class="tab" type="button">
                    <img class="tab-icon" src="/public/images/growth_arrow.svg" alt="">
                    Mines Push
                </button>
            </nav>

            <section style="flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    gap: 20px;" class="content">

                <div class="receiver-row">
                    <label for="receiverTrigger">
                        Select Receiver <span class="required">*</span>
                    </label>

                    <div class="custom-select" id="receiverDropdown">
                        <button type="button" class="custom-select-trigger" id="receiverTrigger" aria-haspopup="listbox"
                            aria-expanded="false">
                            <span id="receiverLabel" class="receiver-label">Select receiver</span>
                            <span class="custom-select-arrow"><img src="/public/images/angle_down.svg" alt=""
                                    class=""></span>
                        </button>

                        <div class="custom-select-panel" id="receiverPanel" role="listbox" tabindex="-1"></div>
                    </div>
                </div>

                <section class="mapped-card">
                    <div class="mapped-header">
                        <h2>Mapped <span id="mappedHeading">Users</span></h2>

                        <div class="mapping-actions">
                            <button class="round-btn" id="addUser" type="button" title="Add mapped user">+</button>
                            <button class="round-btn remove" id="removeLast" type="button"
                                title="Remove last mapped user">−</button>
                        </div>
                    </div>

                    <div class="table-head">
                        <div>#</div>
                        <div>Values</div>
                        <div></div>
                    </div>

                    <div class="userList" id="userList"></div>
                </section>

                <div class="footer">
                    <button class="action-btn save" id="saveBtn" type="button">
                        <img class="tab-icon" src="/public/images/save_icon.svg" alt=""> Save
                    </button>

                    <button class="action-btn clear" id="clearBtn" type="button">
                        <img class="tab-icon" src="/public/images/reset_icon.svg" alt=""> Clear
                    </button>
                </div>

            </section>
        </main>
    </div>

    <div class="user-suggestion-panel" id="sharedSuggestionPanel" role="listbox"></div>

    <script src="/public/js/dashboard.js"></script>
</body>

</html>
